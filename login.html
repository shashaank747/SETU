<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AppTechno CampusOS</title>
  <meta name="description" content="Sign in to AppTechno CampusOS Portal - Smarter Campuses, Brighter Futures.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css?v=8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E">
</head>
<body class="login-page-body">

  <!-- Matrix Digital Rain Canvas -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Ambient Glow -->
  <div class="login-ambient-glow"></div>

  <!-- Top Navigation -->
  <header class="login-top-nav">
    <!-- Back to Home -->
    <a href="index.html" class="back-home-link" id="link-back-home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to CampusOS Home</span>
    </a>

    <!-- Official Brand Logo -->
    <a href="index.html" class="login-brand-link">
      <img src="setu.png" alt="SETU" class="login-brand-logo-img">
    </a>
  </header>

  <!-- Login Container -->
  <main class="login-container">
    <!-- Interactive Cyber Robot Mascot -->
    <div class="robot-stage" id="robot-stage">
      <div class="robot-body-wrapper">
        <!-- 3D Ambient Occlusion Shadow -->
        <div class="robot-ground-shadow"></div>

        <!-- 3D Metallic Antenna Assembly -->
        <div class="robot-antenna-assembly">
          <div class="robot-antenna-orb" id="antenna-orb">
            <div class="antenna-glass-shine"></div>
            <div class="antenna-plasma-core"></div>
          </div>
          <div class="robot-antenna-stalk"></div>
          <div class="robot-antenna-base"></div>
        </div>

        <!-- 3D Cylindrical Ear Nodes -->
        <div class="robot-ear left">
          <div class="ear-bevel"></div>
          <div class="ear-core-light"></div>
        </div>
        <div class="robot-ear right">
          <div class="ear-bevel"></div>
          <div class="ear-core-light"></div>
        </div>

        <!-- 3D Sculpted Robot Head -->
        <div class="robot-head" id="robot-head">
          <div class="head-specular-sheen"></div>
          <div class="head-rim-highlight"></div>

          <!-- 3D Visor Recessed Socket -->
          <div class="robot-visor-frame">
            <div class="robot-visor">
              <div class="visor-curved-glare"></div>
              
              <!-- Left 3D Eye -->
              <div class="robot-eye left">
                <div class="robot-eyelid"></div>
                <div class="robot-pupil">
                  <div class="pupil-glint-main"></div>
                  <div class="pupil-glint-sub"></div>
                </div>
              </div>

              <!-- Right 3D Eye -->
              <div class="robot-eye right">
                <div class="robot-eyelid"></div>
                <div class="robot-pupil">
                  <div class="pupil-glint-main"></div>
                  <div class="pupil-glint-sub"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Holographic Speech Bubble "Hi! 👋" -->
        <div class="robot-speech-bubble" id="robot-speech">
          <span class="speech-text" id="speech-text">Hi! 👋</span>
          <div class="speech-arrow"></div>
        </div>

        <!-- 3D Robotic Gauntlets with 4 Articulated Fingers -->
        <div class="robot-hand left" id="robot-hand-left">
          <div class="hand-knuckle-plate"></div>
          <div class="hand-fingers-grid">
            <div class="robot-finger"><span class="finger-glow-tip"></span></div>
            <div class="robot-finger"><span class="finger-glow-tip"></span></div>
            <div class="robot-finger"><span class="finger-glow-tip"></span></div>
            <div class="robot-finger"><span class="finger-glow-tip"></span></div>
          </div>
        </div>
        <div class="robot-hand right" id="robot-hand-right">
          <div class="hand-knuckle-plate"></div>
          <div class="hand-fingers-grid">
            <div class="robot-finger"><span class="finger-glow-tip"></span></div>
            <div class="robot-finger"><span class="finger-glow-tip"></span></div>
            <div class="robot-finger"><span class="finger-glow-tip"></span></div>
            <div class="robot-finger"><span class="finger-glow-tip"></span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Login Card -->
    <section class="login-card">
      <div class="login-card-header">
        <h1 class="login-card-title">Sign in to <span>CampusOS</span></h1>
        <p class="login-card-subtitle">Enter your credentials to access your campus account</p>
      </div>

      <!-- Form -->
      <form id="login-form" class="login-form" action="dashboard.html">
        <!-- Email Input -->
        <div class="form-group">
          <div class="input-label-row">
            <label for="login-email">Institute Email ID / Username</label>
          </div>
          <div class="input-field-wrapper">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              type="email" 
              id="login-email" 
              class="login-input" 
              placeholder="e.g. name@campusos.edu" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <div class="input-label-row">
            <label for="login-password">Password</label>
            <a href="#" class="forgot-password-link">Forgot password?</a>
          </div>
          <div class="input-field-wrapper">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="login-password" 
              class="login-input" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="input-toggle-right" id="toggle-password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <label class="remember-row">
          <input type="checkbox" id="remember-me" checked>
          <span>Keep me logged in on this terminal</span>
        </label>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit-login" id="btn-submit-login">
          <span>Sign In to Portal</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Footer Help -->
      <div class="login-card-footer">
        <span>Need campus access or student admission?</span>
        <a href="index.html#features">Enroll with CampusOS</a>
      </div>
    </section>
  </main>

  <!-- Login Toast Notifications -->
  <div class="toast-container" id="login-toast-container"></div>

  <!-- Scripts -->
  <script src="js/matrix.js?v=9"></script>
  <script src="js/robot.js?v=9"></script>
  <script src="js/login.js?v=9"></script>
</body>
</html>
